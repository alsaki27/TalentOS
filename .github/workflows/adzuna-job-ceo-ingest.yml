name: Adzuna → Job CEO ingest

# Daily Adzuna discovery using TalentOS's effective Job CEO keyword set.
# Scheduled at 23:00 UTC (05:00 Bangladesh time). Manual runs default to dry-run;
# this still consumes Adzuna/search API calls but does not stage jobs.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      role_group:
        description: "TalentOS role group id, or 'all'."
        required: false
        default: "all"
      days:
        description: "Maximum posting age in days (1–31)."
        required: false
        default: "2"
      runs_per_day:
        description: "Keyword rotation cadence (1 or 2 runs/day)."
        required: false
        default: "1"
      dry_run:
        description: "Search and resolve direct links without writing to TalentOS."
        required: true
        type: boolean
        default: true

concurrency:
  group: adzuna-job-ceo-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neon-cloudflare-migration

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Adzuna collector dependencies
        run: pip install -r scripts/requirements-adzuna-job-ceo.txt

      - name: Search Adzuna and stage matching jobs
        id: ingest
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          INGEST_SECRET: ${{ secrets.JOB_CEO_INGEST_SECRET }}
          BASE_URL: ${{ vars.TALENTOS_BASE_URL || 'https://talent.skarion.com' }}
          ROLE_GROUP: ${{ inputs.role_group || 'all' }}
          DAYS: ${{ inputs.days || '2' }}
          RUNS_PER_DAY: ${{ inputs.runs_per_day || '1' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--role-group "$ROLE_GROUP" --days "$DAYS" --runs-per-day "$RUNS_PER_DAY" --call-budget 35)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/adzuna_job_ceo_ingest.py "${ARGS[@]}"

      - name: Drive Job CEO pipeline to completion
        if: ${{ success() && !inputs.dry_run && steps.ingest.outputs.run_id != '' }}
        env:
          BASE_URL: ${{ vars.TALENTOS_BASE_URL || 'https://talent.skarion.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          RUN_ID="${{ steps.ingest.outputs.run_id }}"
          if [[ ! "$RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::The Adzuna ingest step did not provide a valid Job CEO run id."
            exit 1
          fi
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::CRON_SECRET is required to drive the Job CEO pipeline."
            exit 1
          fi

          # A 40-job Adzuna run can legitimately spend close to an hour in
          # Deep Fetch. Allow 75 minutes for that run, with collector time and
          # a safety margin before the 90-minute GitHub job timeout.
          deadline=$((SECONDS + 4500))
          consecutive_failures=0
          dispatch_response=$(mktemp)
          status_response=$(mktemp)
          trap 'rm -f "$dispatch_response" "$status_response"' EXIT

          while [ "$SECONDS" -lt "$deadline" ]; do
            dispatch_http=$(curl -sS -o "$dispatch_response" -w '%{http_code}' \
              --max-time 300 --connect-timeout 15 \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              "$BASE_URL/api/job-ceo/dispatch?runId=$RUN_ID" || true)

            if [[ ! "$dispatch_http" =~ ^2[0-9][0-9]$ ]] || \
              ! jq -e --arg run_id "$RUN_ID" '.runId == $run_id and (.needsDispatch | type == "boolean")' "$dispatch_response" >/dev/null; then
              consecutive_failures=$((consecutive_failures + 1))
              echo "::warning::Scoped Job CEO dispatch failed (HTTP ${dispatch_http:-unknown}); failure $consecutive_failures/5."
              if [ "$consecutive_failures" -ge 5 ]; then
                echo "::error::Five consecutive scoped Job CEO dispatch calls failed."
                cat "$dispatch_response"
                exit 1
              fi
              sleep 10
              continue
            fi

            stage=$(jq -r '.stage // "unknown"' "$dispatch_response")
            count=$(jq -r '.count // 0' "$dispatch_response")
            needs_dispatch=$(jq -r '.needsDispatch' "$dispatch_response")

            status_http=$(curl -sS -o "$status_response" -w '%{http_code}' \
              --max-time 30 --connect-timeout 15 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/job-ceo/runs/$RUN_ID" || true)
            if [[ "$status_http" != "200" ]] || ! jq -e '.run.status' "$status_response" >/dev/null; then
              consecutive_failures=$((consecutive_failures + 1))
              echo "::warning::Could not read Adzuna run status (HTTP ${status_http:-unknown}); failure $consecutive_failures/5."
              if [ "$consecutive_failures" -ge 5 ]; then
                echo "::error::Five consecutive Adzuna run-status checks failed."
                cat "$status_response"
                exit 1
              fi
              sleep 10
              continue
            fi

            consecutive_failures=0
            run_status=$(jq -r '.run.status' "$status_response")
            echo "Adzuna Job CEO run=$RUN_ID status=$run_status stage=$stage count=$count needsDispatch=$needs_dispatch"
            case "$run_status" in
              completed)
                echo "Adzuna Job CEO pipeline completed for run $RUN_ID."
                exit 0
                ;;
              failed|cancelled)
                echo "::error::Adzuna Job CEO run $RUN_ID ended with status=$run_status."
                jq -r '.run.last_error // "No error detail recorded."' "$status_response"
                exit 1
                ;;
              ingesting|qa|deep_fetch|matchmaking)
                ;;
              *)
                echo "::error::Unexpected status '$run_status' for Adzuna run $RUN_ID."
                exit 1
                ;;
            esac

            # needsDispatch=false can mean another worker currently holds the
            # staging-row lease. Keep checking this run's persisted status and
            # retry after a short wait; never use global queue emptiness as the
            # completion condition.
            if [ "$needs_dispatch" = "true" ]; then
              sleep 5
            else
              sleep 15
            fi
          done
          echo "::error::Adzuna Job CEO run $RUN_ID did not finish within 75 minutes."
          exit 1
