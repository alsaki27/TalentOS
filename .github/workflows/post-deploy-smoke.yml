name: Post-deploy smoke tests
on:
  workflow_run:
    workflows: ["Deploy TalentOS (Cloudflare)"]
    types: [completed]
jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -sSf https://skarion-talent-os.skarion-talentos.workers.dev/api/health
      - name: AI key readiness
        run: curl -sSf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://skarion-talent-os.skarion-talentos.workers.dev/api/admin/ai-key-readiness
