name: Scheduled Candidate Job Logging

on:
  # The daily 05:00 BDT trigger and minute-by-minute continuation are owned
  # by Cloudflare Cron (worker-entry.mjs). GitHub scheduling is best effort.
  workflow_dispatch:

concurrency:
  group: scheduled-candidate-logging
  cancel-in-progress: false

jobs:
  log-matching-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run scheduled candidate logging batch
        env:
          TALENTOS_BASE_URL: ${{ vars.TALENTOS_BASE_URL || 'https://talent.skarion.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured."
            exit 1
          fi

          BASE_URL="$(printf '%s' "$TALENTOS_BASE_URL" | tr -d '[:space:]')"
          BASE_URL="${BASE_URL%/}"
          echo "Requesting a durable TalentOS batch. Cloudflare will process bounded chunks."
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "X-Scheduled-Logging-Trigger: manual" \
            -H "X-Scheduled-Logging-Request-Id: github-${GITHUB_RUN_ID}" \
            -H "Content-Type: application/json" \
            "$BASE_URL/api/cron/scheduled-candidate-logging"
          echo ""
          echo "Request accepted; this is not a claim that the batch finished. Follow run history at $BASE_URL/admin/auto-job-logging."
