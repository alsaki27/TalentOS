name: Scheduled Jobs

env:
  TALENTOS_BASE_URL: ${{ vars.TALENTOS_BASE_URL || 'https://skarion-talent-os.skarion-talentos.workers.dev' }}

on:
  schedule:
    - cron: '*/5 * * * *'  # dispatch-workflows + email-queue – every 5 minutes
    - cron: '0 * * * *'    # ai-key-health – hourly (only tests rate_limited/quota_exhausted/failing keys)
    - cron: '0 8 * * *'    # AI digest – daily at 08:00 UTC
    - cron: '0 6 * * *'    # Import sources – daily at 06:00 UTC
    - cron: '0 4 * * *'    # Backup – daily at 04:00 UTC
    - cron: '0 7 * * *'    # Job categorization – daily at 07:00 UTC
    - cron: '0 3 * * *'    # AI usage rollup – daily at 03:00 UTC
    - cron: '0 0 * * *'    # Job agent scrape – daily at 00:00 UTC
    - cron: '*/10 * * * *' # JOB CEO dispatch – every 10 minutes
    - cron: '*/15 * * * *' # Job description enrichment – every 15 minutes
    - cron: '*/20 * * * *' # Gmail sync + AI triage – every 20 minutes
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        default: ''
        options:
          - dispatch-workflows
          - ai-key-health
          - ai-digest
          - import-sources
          - backup
          - job-categorization
          - ai-usage-rollup
          - job-agent
          - email-queue
          - run-all
          - job-ceo-dispatch
          - job-description-enrichment
          - retry-failed-since
          - job-agent-poll
          - gmail-sync


jobs:
  dispatch-workflows:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '*/5 * * * *') ||
      github.event.inputs.job == 'dispatch-workflows' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Workflow dispatcher
    steps:
      - name: Call Workflow dispatcher (looped)
        run: |
          # GitHub Actions' cron floor is 5 minutes - it cannot be scheduled
          # any more frequently than that, no matter the cron expression. Each
          # backgroundDispatch() call (ctx.waitUntil) is *meant* to keep the
          # pipeline self-chaining between stages without needing this cron at
          # all, but that isn't observably happening in production despite
          # being wired up per Cloudflare's documented API (confirmed live:
          # a workflow sat at stage 0 with zero stage_runs for 5+ minutes of
          # hands-off testing after the fix deployed). Until that's understood,
          # loop this single cron tick for ~4.5 minutes so any workflow stuck
          # between stages gets picked up within seconds rather than waiting
          # for the next scheduled run - same 5-minute cron cadence, but acting
          # as a near-continuous poller instead of one shot per tick.
          END=$((SECONDS + 270))
          CALLS=0
          FAILURES=0
          while [ $SECONDS -lt $END ]; do
            CALLS=$((CALLS + 1))
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/application-ai-workflows/dispatch")
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
              FAILURES=$((FAILURES + 1))
              echo "::warning::Dispatch call failed with HTTP $HTTP_CODE"
            fi
            sleep 15
          done
          # Only fail the run if the majority of calls failed - a single
          # transient blip among ~18 calls per tick shouldn't page anyone,
          # but sustained failure across the run should.
          if [ "$FAILURES" -gt "$((CALLS / 2))" ]; then
            echo "::error::$FAILURES of $CALLS dispatch calls failed this run"
            exit 1
          fi

  ai-digest:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 8 * * *') ||
      github.event.inputs.job == 'ai-digest' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: AI digest
    steps:
      - name: Call AI digest
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/digest")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  job-agent-poll:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '*/5 * * * *') ||
      github.event.inputs.job == 'job-agent-poll' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Job Agent Poller
    steps:
      - name: Call Job Agent poll API
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/job-agent-poll")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi


  import-sources:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 6 * * *') ||
      github.event.inputs.job == 'import-sources' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Import sources
    steps:
      - name: Call Import sources
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/import-sources")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  backup:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 4 * * *') ||
      github.event.inputs.job == 'backup' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Backup
    steps:
      - name: Call Backup
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/backup")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  job-categorization:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 7 * * *') ||
      github.event.inputs.job == 'job-categorization' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Job categorization
    steps:
      - name: Call Job categorization
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/categorize-jobs")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  job-agent:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 0 * * *') ||
      github.event.inputs.job == 'job-agent' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Job agent scrape
    steps:
      - name: Call Job agent scrape
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/job-agent")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  ai-usage-rollup:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 3 * * *') ||
      github.event.inputs.job == 'ai-usage-rollup' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: AI usage rollup
    steps:
      - name: Call AI usage rollup
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/ai-usage-rollup")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  ai-key-health:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 * * * *') ||
      github.event.inputs.job == 'ai-key-health' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: AI key health
    steps:
      - name: Call AI key health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/ai-key-health")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  email-queue:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '*/5 * * * *') ||
      github.event.inputs.job == 'email-queue' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Email queue
    steps:
      - name: Call Email queue
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/email-queue")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  job-ceo-dispatch:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '*/10 * * * *') ||
      github.event.inputs.job == 'job-ceo-dispatch' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: JOB CEO dispatch
    # Hard wall: GitHub Actions job timeout prevents a runaway loop from
    # consuming runner minutes indefinitely. The inner loop already has its own
    # 55-minute safety limit, but this provides a second layer of protection.
    timeout-minutes: 60
    steps:
      - name: Call JOB CEO dispatch (smart loop)
        run: |
          # Strategy: call /api/job-ceo/dispatch in a tight loop.
          # - Read the JSON body on every call.
          # - If needsDispatch=false the run is fully complete — break immediately.
          # - Sleep 5 seconds between calls (enough time for Cloudflare to process
          #   a batch before the next request lands).
          # - Hard wall: 55 minutes total (leaves 5 minutes of safety margin before
          #   the 60-minute job timeout).
          # This turns what was a 10-hour "one call per tick" problem into a
          # self-draining loop: a 300-job run finishes in 30-45 minutes instead.
          WALL_END=$((SECONDS + 3300))   # 55 * 60
          CALLS=0
          FAILURES=0
          CONSECUTIVE_FAILURES=0
          MAX_CONSECUTIVE_FAILURES=5

          echo "JOB CEO dispatch smart loop started. Will run until needsDispatch=false or wall time."

          while [ $SECONDS -lt $WALL_END ]; do
            CALLS=$((CALLS + 1))
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              "${{ env.TALENTOS_BASE_URL }}/api/job-ceo/dispatch" 2>&1)

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
              FAILURES=$((FAILURES + 1))
              CONSECUTIVE_FAILURES=$((CONSECUTIVE_FAILURES + 1))
              echo "::warning::Call $CALLS: JOB CEO dispatch HTTP $HTTP_CODE — body: $(echo $BODY | head -c 200)"
              if [ "$CONSECUTIVE_FAILURES" -ge "$MAX_CONSECUTIVE_FAILURES" ]; then
                echo "::error::$CONSECUTIVE_FAILURES consecutive failures — aborting dispatch loop."
                exit 1
              fi
              sleep 5
              continue
            fi

            CONSECUTIVE_FAILURES=0

            # Check if the run is complete
            NEEDS_DISPATCH=$(echo "$BODY" | grep -o '"needsDispatch":[^,}]*' | grep -o 'true\|false' || echo "true")
            STAGE=$(echo "$BODY" | grep -o '"stage":"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"' || echo "unknown")
            COUNT=$(echo "$BODY" | grep -o '"count":[0-9]*' | grep -o '[0-9]*' || echo "0")

            echo "Call $CALLS: stage=$STAGE count=$COUNT needsDispatch=$NEEDS_DISPATCH"

            if [ "$NEEDS_DISPATCH" = "false" ]; then
              echo "✓ JOB CEO dispatch complete — run is fully done. Exiting loop after $CALLS calls."
              break
            fi

            sleep 5
          done

          if [ "$CALLS" -eq 0 ]; then
            echo "::error::No dispatch calls were made."
            exit 1
          fi

          # Fail only if a majority of all calls failed (transient blips are acceptable)
          if [ "$FAILURES" -gt "$((CALLS / 2))" ]; then
            echo "::error::$FAILURES of $CALLS JOB CEO dispatch calls failed this run"
            exit 1
          fi

          echo "JOB CEO dispatch loop done: $CALLS calls, $FAILURES failures."



  job-description-enrichment:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '*/15 * * * *') ||
      github.event.inputs.job == 'job-description-enrichment' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Job description enrichment
    steps:
      - name: Call description enrichment
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/job-ceo/enrich")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Scheduled job failed with HTTP $HTTP_CODE"
            exit 1
          fi

  gmail-sync:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '*/20 * * * *') ||
      github.event.inputs.job == 'gmail-sync' ||
      github.event.inputs.job == 'run-all'
    runs-on: ubuntu-latest
    name: Gmail sync + AI triage
    steps:
      - name: Call Gmail sync
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/cron/gmail-sync")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "$BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Gmail sync failed with HTTP $HTTP_CODE"
            exit 1
          fi

  # Manual cleanup only, deliberately not part of any cron schedule or
  # run-all - this bulk-retries everything that failed during the Aug 4
  # 2026 Vertex gateway outage (stale ai_key_id routing -> gateway auth
  # header mismatch -> stale Cloudflare secret). Not something that should
  # ever fire automatically; trigger by hand once, after confirming the
  # underlying gateway fixes are actually live.
  retry-failed-since:
    if: github.event.inputs.job == 'retry-failed-since'
    runs-on: ubuntu-latest
    name: Retry everything failed during the Vertex outage
    steps:
      - name: Call retry-failed-since
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ env.TALENTOS_BASE_URL }}/api/admin/retry-failed-since")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "$BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::retry-failed-since failed with HTTP $HTTP_CODE"
            exit 1
          fi
