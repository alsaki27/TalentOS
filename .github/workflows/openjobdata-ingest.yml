name: OpenJobData Ingest

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max rows to fetch from parquet'
        required: false
        default: '500'
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface_hub pandas pyarrow requests

      - name: Run OpenJobData ingest
        run: python scripts/openjobdata_ingest.py ${{ inputs.limit || '500' }}
        env:
          HF_DATASET: ${{ vars.OPENJOBDATA_HF_DATASET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INGEST_SECRET: ${{ secrets.JOB_CEO_INGEST_SECRET }}
          BASE_URL: ${{ vars.TALENTOS_BASE_URL || 'https://skarion-talent-os.skarion-talentos.workers.dev' }}
