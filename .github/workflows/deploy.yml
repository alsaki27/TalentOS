name: Deploy TalentOS (Cloudflare)

# Every deploy goes through this pipeline, off a real commit, with CI as a
# pre-flight gate. The CI workflow (ci.yml) handles typecheck, lint, unit
# tests, E2E tests, and Cloudflare build — this workflow only runs after CI
# passes, then performs deploy-specific steps (size check, schema fixes,
# deploy, post-deploy health checks).
#
# `wrangler deploy` does NOT wipe a Worker's existing secrets - only a
# named `wrangler secret put` changes that one secret. This workflow only
# explicitly (re)sets DATABASE_URL, since that's the one secret with a
# previously-undocumented, non-obvious correct format (direct endpoint,
# no -pooler, no channel_binding - see
# docs/CLOUDFLARE_DIAGNOSTIC_AND_PDF_STRATEGY.md for why). Every other
# secret already set on the live Worker (JWT_SECRET, AI_KEYS_ENCRYPTION_SECRET,
# CRON_SECRET, SUPABASE_*, AI provider keys, etc.) is left untouched by
# this workflow - add an explicit `secret put` step here if one of those
# ever needs to be rotated through CI instead of by hand.
on:
  # GitHub evaluates a workflow_run trigger against the copy of THIS FILE on
  # the repo's default branch (main), not the branch that ran CI - main's
  # deploy.yml still has the old `on: push` trigger (never synced), so the
  # workflow_run trigger below has been silently dead since it was added:
  # zero Deploy runs fired despite CI succeeding repeatedly. Restoring a
  # direct push trigger so deploy actually runs; keeping workflow_run too in
  # case main gets synced later and CI-gating becomes real.
  push:
    branches: [neon-cloudflare-migration]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [neon-cloudflare-migration]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build for Cloudflare (OpenNext)
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}

      - name: Install Playwright browsers
        if: false # SKIPPED (temporary, user-requested) - see "Run E2E tests" below
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # TEMPORARY (skipped, user-requested).
        if: false
        run: npm run test:e2e
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TEST_BASE_URL: https://talent.skarion.com
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Check Worker bundle size before deploying
        run: |
          OUTPUT=$(npx wrangler deploy --dry-run --outdir /tmp/wrangler-dryrun 2>&1)
          echo "$OUTPUT"
          SIZE_KIB=$(echo "$OUTPUT" | grep -oP 'gzip: \K[0-9.]+' || echo "")
          if [ -z "$SIZE_KIB" ] || [ "$SIZE_KIB" = "0" ]; then
            echo "::error::Could not parse gzip size from wrangler output. Raw output:" && echo "$OUTPUT"
            exit 1
          fi
          echo "Worker gzipped upload size: ${SIZE_KIB} KiB"
          # Account is on Cloudflare Workers Paid (10 MB / 10240 KiB compressed
          # limit, not the free plan's 3072 KiB) - budget raised accordingly,
          # with headroom kept below the hard limit the same way the old
          # 3072 budget kept headroom below the free-plan limit.
          BUDGET_KIB=9000
          if awk -v s="$SIZE_KIB" 'BEGIN { exit !(s > 8500) }'; then
            echo "::warning::Bundle is ${SIZE_KIB} KiB — approaching the ${BUDGET_KIB} KiB budget. Reduce dependencies."
          fi
          if awk -v s="$SIZE_KIB" -v b="$BUDGET_KIB" 'BEGIN { exit !(s > b) }'; then
            echo "::error::Worker bundle is ${SIZE_KIB} KiB, over the ${BUDGET_KIB} KiB budget (Cloudflare Workers Paid hard limit is 10240 KiB / 10 MB compressed). Deploy would be rejected by Cloudflare - check the output above for the largest dependencies before merging."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run Neon schema fixes (sql/neon_fixes/)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          FAILED_FILES=""
          for f in sql/neon_fixes/*.sql; do
            echo "::group::Applying $f"
            if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" 2>&1; then
              echo "  OK"
            else
              echo "::error::Schema fix $f failed"
              FAILED_FILES="$FAILED_FILES $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED_FILES" ]; then
            echo "::error::Failed schema fixes:$FAILED_FILES"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Set DATABASE_URL secret (corrected non-pooler format)
        run: echo "$SECRET_VALUE" | npx wrangler secret put DATABASE_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.TALENTOS_DATABASE_URL }}

      - name: Set CRM integration secret
        run: |
          if [ -n "$CRM_INTEGRATION_SECRET" ]; then
            echo "$CRM_INTEGRATION_SECRET" | npx wrangler secret put CRM_INTEGRATION_SECRET
          else
            echo "CRM_INTEGRATION_SECRET is not configured; refusing to enable CRM integration"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_INTEGRATION_SECRET: ${{ secrets.CRM_INTEGRATION_SECRET }}

      - name: Set required authentication and encryption secrets
        run: |
          if [ -z "$JWT_SECRET" ] || [ -z "$AI_KEYS_ENCRYPTION_SECRET" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::JWT_SECRET, AI_KEYS_ENCRYPTION_SECRET, and CRON_SECRET must be configured in GitHub Secrets."
            exit 1
          fi
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          echo "$AI_KEYS_ENCRYPTION_SECRET" | npx wrangler secret put AI_KEYS_ENCRYPTION_SECRET
          echo "$CRON_SECRET" | npx wrangler secret put CRON_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_KEYS_ENCRYPTION_SECRET: ${{ secrets.AI_KEYS_ENCRYPTION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Set required Google OAuth secrets
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET must be configured in GitHub Secrets."
            exit 1
          fi
          echo "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          echo "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Set Google Vertex Proxy secrets (talentos-858973 gateway)
        # googleVertexProxyProvider.ts reads these 4 as process.env on the
        # Worker itself - GitHub Actions secrets are the source of truth,
        # pushed to Cloudflare on every deploy the same way DATABASE_URL is
        # above. Rotate by updating the GitHub secret, not by hand in the
        # Cloudflare dashboard.
        run: |
          echo "$GOOGLE_VERTEX_PROXY_URL" | npx wrangler secret put GOOGLE_VERTEX_PROXY_URL
          echo "$GOOGLE_VERTEX_PROXY_SECRET" | npx wrangler secret put GOOGLE_VERTEX_PROXY_SECRET
          echo "$GOOGLE_VERTEX_MODEL" | npx wrangler secret put GOOGLE_VERTEX_MODEL
          echo "$GOOGLE_VERTEX_FALLBACK_MODEL" | npx wrangler secret put GOOGLE_VERTEX_FALLBACK_MODEL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_VERTEX_PROXY_URL: ${{ secrets.GOOGLE_VERTEX_PROXY_URL }}
          GOOGLE_VERTEX_PROXY_SECRET: ${{ secrets.GOOGLE_VERTEX_PROXY_SECRET }}
          GOOGLE_VERTEX_MODEL: ${{ secrets.GOOGLE_VERTEX_MODEL }}
          GOOGLE_VERTEX_FALLBACK_MODEL: ${{ secrets.GOOGLE_VERTEX_FALLBACK_MODEL }}

      - name: Verify live health after deploy
        run: |
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -w '\n%{http_code}' "https://talent.skarion.com/api/health" || echo "000")
            CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$CODE" = "200" ]; then
              echo "Health check passed: $BODY"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE - $BODY"
            sleep 5
          done
          echo "::error::Live health check failed after deploy - site is not responding healthy at /api/health"
          exit 1

      - name: Verify AI key encryption readiness
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set in GitHub Secrets. Skipping AI key readiness check."
            exit 0
          fi
          
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -w '\n%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://talent.skarion.com/api/admin/ai-key-readiness" || echo "000")
            CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$CODE" = "200" ]; then
              READY=$(echo "$BODY" | grep -o '"ready":\s*true')
              if [ -n "$READY" ]; then
                echo "AI key encryption ready: $BODY"
                exit 0
              fi
              echo "AI keys not encrypted: $BODY"
              echo "::error::AI key encryption is not ready - plaintext keys found in production. Run 'Secure legacy keys' from the Admin UI or set ALLOW_PLAINTEXT_AI_KEYS=true for development only."
              exit 1
            elif [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
              echo "::warning::Authentication failed ($CODE). Make sure CRON_SECRET in GitHub Secrets matches your Cloudflare Worker environment. Skipping readiness check."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE - $BODY"
            sleep 3
          done
          echo "::error::AI key readiness check failed - encryption may not be configured"
          exit 1
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Verify Google OAuth runtime readiness
        run: |
          RESPONSE=$(curl -s -w '\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://talent.skarion.com/api/admin/integrations/google/readiness")
          CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$CODE" != "200" ] || ! echo "$BODY" | grep -q '"ready":true'; then
            echo "::error::Google OAuth runtime is not ready after deploy (HTTP $CODE)."
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
