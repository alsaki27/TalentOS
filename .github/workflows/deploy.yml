name: Deploy TalentOS (Cloudflare)

# Every automatic deploy runs only after CI succeeds. Database SQL scripts are
# reserved for an explicitly requested manual deployment; normal code deploys
# must not modify the TalentOS database.
#
# `wrangler deploy` does NOT wipe a Worker's existing secrets - only a
# named `wrangler secret put` changes that one secret. This workflow only
# explicitly (re)sets DATABASE_URL, since that's the one secret with a
# previously-undocumented, non-obvious correct format (direct endpoint,
# no -pooler, no channel_binding - see
# docs/CLOUDFLARE_DIAGNOSTIC_AND_PDF_STRATEGY.md for why). Every other
# secret already set on the live Worker (JWT_SECRET, AI_KEYS_ENCRYPTION_SECRET,
# CRON_SECRET, SUPABASE_*, AI provider keys, etc.) is left untouched by
# this workflow - add an explicit `secret put` step here if one of those
# ever needs to be rotated through CI instead of by hand.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [neon-cloudflare-migration]
  workflow_dispatch:
    inputs:
      skip_schema_fixes:
        description: "Skip SQL database scripts; disable only for an intentional migration"
        required: false
        default: true
        type: boolean
      apply_resume_forge_qwen37_plus:
        description: "Apply only migration 105 to set Resume Forge's active OpenCode route to Qwen 3.7 Plus"
        required: false
        default: false
        type: boolean

concurrency:
  group: talentos-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate Cloudflare production wiring
        run: npm run cf:verify

      - name: Verify generated Cloudflare types
        run: npm run cf:types:check

      - name: Build for Cloudflare (OpenNext)
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}

      - name: Install Playwright browsers
        if: false # SKIPPED (temporary, user-requested) - see "Run E2E tests" below
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # TEMPORARY (skipped, user-requested).
        if: false
        run: npm run test:e2e
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TEST_BASE_URL: https://talent.skarion.com
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Check Worker bundle size before deploying
        run: |
          OUTPUT=$(npx wrangler deploy --dry-run --outdir /tmp/wrangler-dryrun 2>&1)
          echo "$OUTPUT"
          SIZE_KIB=$(echo "$OUTPUT" | grep -oP 'gzip: \K[0-9.]+' || echo "")
          if [ -z "$SIZE_KIB" ] || [ "$SIZE_KIB" = "0" ]; then
            echo "::error::Could not parse gzip size from wrangler output. Raw output:" && echo "$OUTPUT"
            exit 1
          fi
          echo "Worker gzipped upload size: ${SIZE_KIB} KiB"
          # Account is on Cloudflare Workers Paid (10 MB / 10240 KiB compressed
          # limit, not the free plan's 3072 KiB) - budget raised accordingly,
          # with headroom kept below the hard limit the same way the old
          # 3072 budget kept headroom below the free-plan limit.
          BUDGET_KIB=9000
          if awk -v s="$SIZE_KIB" 'BEGIN { exit !(s > 8500) }'; then
            echo "::warning::Bundle is ${SIZE_KIB} KiB — approaching the ${BUDGET_KIB} KiB budget. Reduce dependencies."
          fi
          if awk -v s="$SIZE_KIB" -v b="$BUDGET_KIB" 'BEGIN { exit !(s > b) }'; then
            echo "::error::Worker bundle is ${SIZE_KIB} KiB, over the ${BUDGET_KIB} KiB budget (Cloudflare Workers Paid hard limit is 10240 KiB / 10 MB compressed). Deploy would be rejected by Cloudflare - check the output above for the largest dependencies before merging."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Re-validate production wiring before deploy
        run: npm run cf:verify -- --production

      - name: Run TalentOS SQL migrations (manual dispatch only)
        # Directory name is historical; the database is now self-hosted Postgres.
        # psql is fine against its self-signed certificate: libpq reads
        # sslmode=require as "encrypt, do not verify", unlike node-postgres which
        # treats it as verify-full (see src/server/db/neon.ts).
        # Only an intentional manual dispatch may run SQL against TalentOS.
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.skip_schema_fixes != true || inputs.apply_resume_forge_qwen37_plus == true) }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          # Fail loudly and specifically if the database is simply unreachable.
          # The runner's IP is dynamic, so a host firewall that allow-lists
          # addresses will block this step, and the bare psql error for that is
          # easy to misread as a schema problem.
          if ! psql "$DATABASE_URL" -c 'select 1' >/dev/null 2>&1; then
            echo "::error::Cannot reach the database from this runner. If the VPS firewall restricts access by IP, GitHub Actions runners use dynamic addresses - either allow them, or run migrations from a host that is permitted."
            exit 1
          fi
          FAILED_FILES=""
          if [ "$APPLY_RESUME_FORGE_QWEN37_PLUS" = "true" ]; then
            FILES="sql/neon_fixes/105_resume_forge_qwen37_plus.sql"
          else
            FILES="sql/neon_fixes/*.sql"
          fi
          for f in $FILES; do
            echo "::group::Applying $f"
            if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" 2>&1; then
              echo "  OK"
            else
              echo "::error::Schema fix $f failed"
              FAILED_FILES="$FAILED_FILES $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED_FILES" ]; then
            echo "::error::Failed schema fixes:$FAILED_FILES"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}
          APPLY_RESUME_FORGE_QWEN37_PLUS: ${{ inputs.apply_resume_forge_qwen37_plus }}

      - name: Deploy Worker with secrets atomically
        # Wrangler 4 uploads the Worker code, Wrangler bindings, and this
        # secret file as one version. Secrets omitted here are preserved by
        # Cloudflare; no follow-up secret mutation creates a second version.
        # The OpenNext build has already completed above. Tell Wrangler that
        # this is the final deploy invocation so it does not auto-launch the
        # OpenNext deploy wrapper again (which would re-enter local Hyperdrive
        # emulation and reject the production-only binding).
        run: |
          set -euo pipefail
          if [ -z "$JWT_SECRET" ] || [ -z "$AI_KEYS_ENCRYPTION_SECRET" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::JWT_SECRET, AI_KEYS_ENCRYPTION_SECRET, and CRON_SECRET must be configured in GitHub Secrets."
            exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET must be configured in GitHub Secrets."
            exit 1
          fi
          if [ -z "$GMAIL_CLIENT_ID" ] || [ -z "$GMAIL_CLIENT_SECRET" ]; then
            echo "::error::GMAIL_CLIENT_ID and GMAIL_CLIENT_SECRET must be configured in GitHub Secrets."
            exit 1
          fi

          SECRETS_FILE="$(mktemp)"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          jq -n \
            --arg database_url "$DATABASE_URL" \
            --arg jwt_secret "$JWT_SECRET" \
            --arg ai_keys_encryption_secret "$AI_KEYS_ENCRYPTION_SECRET" \
            --arg cron_secret "$CRON_SECRET" \
            --arg google_client_id "$GOOGLE_CLIENT_ID" \
            --arg google_client_secret "$GOOGLE_CLIENT_SECRET" \
            --arg gmail_client_id "$GMAIL_CLIENT_ID" \
            --arg gmail_client_secret "$GMAIL_CLIENT_SECRET" \
            --arg crm_integration_secret "$CRM_INTEGRATION_SECRET" \
            --arg skarion_crm_api_key "$SKARION_CRM_API_KEY" \
            --arg skarion_crm_api_url "$SKARION_CRM_API_URL" \
            --arg gmail_push_token "$GMAIL_PUSH_TOKEN" \
            --arg gmail_pubsub_topic "$GMAIL_PUBSUB_TOPIC" \
            '{
              DATABASE_URL: $database_url,
              JWT_SECRET: $jwt_secret,
              AI_KEYS_ENCRYPTION_SECRET: $ai_keys_encryption_secret,
              CRON_SECRET: $cron_secret,
              GOOGLE_CLIENT_ID: $google_client_id,
              GOOGLE_CLIENT_SECRET: $google_client_secret,
              GMAIL_CLIENT_ID: $gmail_client_id,
              GMAIL_CLIENT_SECRET: $gmail_client_secret
            }
            + (if $crm_integration_secret != "" then {CRM_INTEGRATION_SECRET: $crm_integration_secret} else {} end)
            + (if $skarion_crm_api_key != "" then {SKARION_CRM_API_KEY: $skarion_crm_api_key} else {} end)
            + (if $skarion_crm_api_url != "" then {SKARION_CRM_API_URL: $skarion_crm_api_url} else {} end)
            + (if $gmail_push_token != "" then {GMAIL_PUSH_TOKEN: $gmail_push_token} else {} end)
            + (if $gmail_pubsub_topic != "" then {GMAIL_PUBSUB_TOPIC: $gmail_pubsub_topic} else {} end)
            ' > "$SECRETS_FILE"
          npx wrangler deploy --secrets-file "$SECRETS_FILE" --message "TalentOS ${GITHUB_SHA}" --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN_NEXT_DEPLOY: "true"
          DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_KEYS_ENCRYPTION_SECRET: ${{ secrets.AI_KEYS_ENCRYPTION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          CRM_INTEGRATION_SECRET: ${{ secrets.CRM_INTEGRATION_SECRET }}
          SKARION_CRM_API_KEY: ${{ secrets.SKARION_CRM_API_KEY }}
          SKARION_CRM_API_URL: ${{ secrets.SKARION_CRM_API_URL }}
          GMAIL_PUSH_TOKEN: ${{ secrets.GMAIL_PUSH_TOKEN }}
          GMAIL_PUBSUB_TOPIC: ${{ secrets.GMAIL_PUBSUB_TOPIC }}

      - name: Verify active Worker version and Hyperdrive binding
        run: npm run cf:verify-live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}

