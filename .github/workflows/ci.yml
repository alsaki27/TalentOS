name: CI

on:
  push:
    branches: [main, neon-cloudflare-migration]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Build for Cloudflare (OpenNext)
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.TALENTOS_DATABASE_URL }}
