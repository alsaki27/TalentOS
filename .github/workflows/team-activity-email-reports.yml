name: Team activity email reports

on:
  # Recurring sends run from the Cloudflare Cron handler, which checks the
  # scheduled instant in America/New_York and handles daylight-saving time.
  # Keep this manual path for an intentional report send or delivery check.
  workflow_dispatch:
    inputs:
      period:
        description: "Report period to send to the configured recipients"
        required: true
        default: weekly
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: read

concurrency:
  group: team-activity-email-reports
  cancel-in-progress: false

env:
  TALENTOS_BASE_URL: ${{ vars.TALENTOS_BASE_URL || 'https://talent.skarion.com' }}

jobs:
  send-team-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the selected report
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REPORT_PERIOD: ${{ inputs.period }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is required to call TalentOS."
            exit 1
          fi

          response=$(curl --silent --show-error --max-time 180 --connect-timeout 20 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Accept: application/json" \
            --output /tmp/team-activity-report-response.json \
            --write-out "%{http_code}" \
            "$TALENTOS_BASE_URL/api/cron/team-activity-report?period=$REPORT_PERIOD") || {
              echo "::error::Could not reach the TalentOS team activity report endpoint."
              exit 1
            }

          cat /tmp/team-activity-report-response.json
          echo
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "::error::The $REPORT_PERIOD team activity report failed with HTTP $response."
            exit 1
          fi
