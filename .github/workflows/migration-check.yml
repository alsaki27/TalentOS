name: Migration Verification

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: talentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply neon_fixes (first pass)
        run: |
          for f in sql/neon_fixes/*.sql; do
            echo "Applying $f (pass 1)"
            PGPASSWORD=test psql -h localhost -U postgres -d talentos_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply neon_fixes (second pass — idempotency)
        run: |
          for f in sql/neon_fixes/*.sql; do
            echo "Applying $f (pass 2)"
            PGPASSWORD=test psql -h localhost -U postgres -d talentos_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify expected columns exist
        run: |
          PGPASSWORD=test psql -h localhost -U postgres -d talentos_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            expected text[][] := ARRAY[
              ARRAY['ai_automation_routes', 'model_override'],
              ARRAY['ai_usage_events',     'route_rank'],
              ARRAY['ai_usage_events',     'attempt_number'],
              ARRAY['ai_usage_events',     'workflow_id'],
              ARRAY['ai_usage_events',     'application_id'],
              ARRAY['ai_usage_events',     'error_code'],
              ARRAY['applications',        'updated_at'],
              ARRAY['applications',        'app_number'],
              ARRAY['candidates',          'candidate_number'],
              ARRAY['jobs',                'job_number']
            ];
            missing text[] := ARRAY[]::text[];
            pair text[];
            found boolean;
          BEGIN
            FOREACH pair SLICE 1 IN ARRAY expected
            LOOP
              SELECT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = pair[1]
                  AND column_name = pair[2]
              ) INTO found;
              IF NOT found THEN
                missing := missing || (pair[1] || '.' || pair[2]);
              END IF;
            END LOOP;

            IF array_length(missing, 1) IS NOT NULL THEN
              RAISE EXCEPTION 'Missing columns: %', array_to_string(missing, ', ');
            END IF;

            RAISE NOTICE 'All expected columns present.';
          END $$;
          SQL
