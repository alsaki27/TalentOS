#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers PAID plan (upgraded 2026-07-13).
# Limits: 128MB memory, 10,000 subrequests/invocation (default).
name = "skarion-talent-os"
main = ".worker-next/index.mjs"
compatibility_date = "2025-06-20"
# nodejs_compat enables some Node.js APIs (e.g., Buffer)
compatibility_flags = ["nodejs_compat"]

# Workers + Assets: host static frontend files
assets = { directory = ".worker-next/assets", binding = "ASSETS" }

[vars]
TALENTOS_BASE_URL = "https://talent.skarion.com"
STAFF_GOOGLE_AUTH_ENABLED = "true"
CANDIDATE_GOOGLE_AUTH_ENABLED = "true"
CANDIDATE_MFA_ENABLED = "true"
CANDIDATE_GMAIL_ENABLED = "true"
BASE_RESUME_KEYWORD_AGENT_ENABLED = "true"
CANDIDATE_JOB_MATCHER_ENABLED = "true"
CANDIDATE_JOB_MATCHER_MODE = "dry_run"

# CPU-time budget for this Worker. This is actual JS compute time only -
# time spent awaiting a fetch() to an upstream API (Gemini/Vertex, Neon,
# etc.) does NOT count against it (see Cloudflare's CPU-time docs). On the
# free tier this defaulted to 10ms, which was nowhere near enough for the
# real compute here: building large prompts (full base resume + evidence
# bank + job analysis get embedded into the Resume Forge/Hiring
# Panel/Final Polish prompts), then JSON.parse + Zod-validating a full
# tailored-resume-shaped response. Confirmed live: every single Resume
# Forge stage_run got silently killed mid-request under the free tier's
# 10ms ceiling - no error, no timeout, just orphaned - while the lighter
# Job Lens stage (smaller prompt/response) usually stayed under it.
#
# 30_000ms (30s) is the Workers Paid plan's own documented default and is
# used here explicitly rather than left implicit, so it's a deliberate,
# visible setting instead of "whatever the platform happens to default
# to." It leaves generous headroom (the actual JS work above is realistically
# low tens-of-milliseconds even for a large resume, not seconds) without
# reaching for the 300_000ms (5min) max, which would mask genuinely
# runaway code for minutes before Cloudflare ever intervened.
[limits]
cpu_ms = 30_000

[observability]
enabled = true

# Secrets are set via `wrangler secret put`, not here:
# DATABASE_URL, NEON_DATABASE_URL, NEON_DATABASE_URL_DIRECT
# CRM_INTEGRATION_SECRET â€” server-to-server company directory access for Skarion CRM
# SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
# AI_KEYS_ENCRYPTION_SECRET, CRON_SECRET, CRAWLER_API_KEY
# ANTHROPIC_API_KEY, NVIDIA_API_KEY, OPENAI_API_KEY
# JOB_CEO_INGEST_SECRET — used by /api/job-ceo/ingest endpoint; must match GitHub secret
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, etc.
# GOOGLE_VERTEX_PROXY_URL, GOOGLE_VERTEX_PROXY_SECRET — Cloud Run gateway
#   (talentos-858973 project, region "global") consumed by
#   src/lib/ai/googleVertexProxyProvider.ts. Both pushed from GitHub Actions
#   secrets in deploy.yml, not set by hand — rotate there.
# GOOGLE_VERTEX_MODEL, GOOGLE_VERTEX_FALLBACK_MODEL — default/fallback model
#   IDs for that provider when a route has no model_override in ai_automation_routes.
#
# Free tier: all secrets are free to set. Only KV and R2 have quotas.
# OPENCODE_DIRECT_API_KEY is the env-managed direct OpenCode Go credential used
# by the tertiary route at https://opencode.ai/zen/go/v1.

# Optional (free tier): ISR cache via KV
# KV limits on free tier: 1,000 reads/day, 1,000 writes/day, 1GB storage
# [[kv_namespaces]]
# binding = "NEXT_CACHE_WORKERS_KV"
# id = "..."

# ───────────────────────────────────────────────────────────────
# Cron Triggers (NOT available on Cloudflare Workers free tier)
# ───────────────────────────────────────────────────────────────
# The app uses Vercel-style cron jobs defined in vercel.json, but
# Cloudflare Workers free tier does NOT support cron triggers.
#
# Workaround: Use an external scheduler (cron-job.org, EasyCron, or
# a GitHub Actions workflow) to call these endpoints with the
# CRON_SECRET bearer token:
#
#   GET /api/cron/digest             — daily AI digest (0 7 * * *)
#   GET /api/cron/import-sources     — run import sources (0 6 * * *)
#   GET /api/cron/backup             — daily DB backup (0 5 * * *)
#   GET /api/cron/categorize-jobs    — AI job categorization (0 8 * * *)
#   GET /api/cron/ai-usage-rollup    — AI usage aggregation (0 4 * * *)
#
# If you upgrade to a paid Cloudflare Workers plan ($5/month), add:
[triggers]
crons = ["0 7 * * *", "0 6 * * *", "0 5 * * *", "0 8 * * *", "0 4 * * *", "* * * * *"]
#
# Since this project uses OpenNext (@opennextjs/cloudflare), Cloudflare 
# scheduled events are automatically routed to the Vercel crons defined 
# in vercel.json. No custom handler is needed!
