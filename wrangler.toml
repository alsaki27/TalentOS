#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers FREE TIER configuration
# Limits: 100,000 requests/day, 10ms CPU per request, 128MB memory
# No Hyperdrive, no Durable Objects, no paid bindings.
name = "skarion-talent-os"
main = ".worker-next/index.mjs"
compatibility_date = "2025-06-20"
# nodejs_compat enables some Node.js APIs on the free tier (e.g., Buffer)
compatibility_flags = ["nodejs_compat"]

# Workers + Assets: host static frontend files (free tier)
assets = { directory = ".worker-next/assets", binding = "ASSETS" }

[observability]
enabled = true

# Secrets are set via `wrangler secret put`, not here:
# DATABASE_URL, NEON_DATABASE_URL, NEON_DATABASE_URL_DIRECT
# SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
# AI_KEYS_ENCRYPTION_SECRET, CRON_SECRET, CRAWLER_API_KEY
# ANTHROPIC_API_KEY, NVIDIA_API_KEY, OPENAI_API_KEY
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, etc.
#
# Free tier: all secrets are free to set. Only KV and R2 have quotas.

# Optional (free tier): ISR cache via KV
# KV limits on free tier: 1,000 reads/day, 1,000 writes/day, 1GB storage
# [[kv_namespaces]]
# binding = "NEXT_CACHE_WORKERS_KV"
# id = "..."

# ───────────────────────────────────────────────────────────────
# Cron Triggers (NOT available on Cloudflare Workers free tier)
# ───────────────────────────────────────────────────────────────
# The app uses Vercel-style cron jobs defined in vercel.json, but
# Cloudflare Workers free tier does NOT support cron triggers.
#
# Workaround: Use an external scheduler (cron-job.org, EasyCron, or
# a GitHub Actions workflow) to call these endpoints with the
# CRON_SECRET bearer token:
#
#   GET /api/cron/digest             — daily AI digest (0 7 * * *)
#   GET /api/cron/import-sources     — run import sources (0 6 * * *)
#   GET /api/cron/backup             — daily DB backup (0 5 * * *)
#   GET /api/cron/categorize-jobs    — AI job categorization (0 8 * * *)
#   GET /api/cron/ai-usage-rollup    — AI usage aggregation (0 4 * * *)
#
# If you upgrade to a paid Cloudflare Workers plan ($5/month), add:
#   [triggers]
#   crons = ["0 7 * * *", "0 6 * * *", "0 5 * * *", "0 8 * * *", "0 4 * * *"]
#
# Then set up a handler in your worker entry to route each cron
# pattern to the corresponding /api/cron/* endpoint.
